<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Page Not Found - VoltFix</title>
  <meta name="description" content="Page not found. Return to VoltFix homepage.">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#fef3c7',
              100: '#fde68a',
              200: '#fcd34d',
              300: '#fbbf24',
              400: '#f59e0b',
              500: '#ea580c',
              600: '#d97706',
              700: '#b45309',
              800: '#92400e',
              900: '#78350f',
            }
          }
        }
      }
    }
  </script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-200">
  <main class="min-h-screen flex items-center justify-center px-4 py-12">
  <div class="text-center px-4">
    <div class="w-24 h-24 bg-gradient-to-r from-yellow-400 to-orange-600 rounded-full flex items-center justify-center mx-auto mb-8">
      <i data-lucide="zap" class="w-12 h-12 text-white"></i>
    </div>
    <h1 class="text-6xl font-bold text-gray-900 dark:text-white mb-4">404</h1>
    <h2 class="text-2xl font-semibold text-gray-700 dark:text-gray-300 mb-4">Page Not Found</h2>
    <p class="text-gray-600 dark:text-gray-400 mb-8 max-w-md mx-auto">
      The page you're looking for doesn't exist or has been moved.
    </p>
    <div class="flex flex-wrap gap-4 justify-center">
      <a href="index.html" class="btn-primary">
        <i data-lucide="home"></i>
        Back to Home
      </a>
      <a href="contact.html" class="btn-secondary">
        <i data-lucide="phone"></i>
        Contact Us
      </a>
    </div>
  </div>
  </main>

  <script src="js/nav.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
